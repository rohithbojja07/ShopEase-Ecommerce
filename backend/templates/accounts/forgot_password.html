<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot Password | ShopEase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container min-vh-100 d-flex justify-content-center align-items-center">
        <div class="card shadow-sm border-0 p-4" style="width:100%;max-width:430px;">
            <h3 class="text-center mb-2">Forgot Password</h3>
            <p class="text-center text-secondary mb-4">Enter your registered email to request a password reset link.</p>

            {% if success %}
                <div class="alert alert-success">{{ success }}</div>
                <a href="/staff/login/" class="btn btn-primary w-100">Go to Login</a>
            {% else %}
                {% if error %}
                    <div class="alert alert-danger">{{ error }}</div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="email" class="form-label">Registered email</label>
                        <input type="email" id="email" name="email"
                               class="form-control" value="{{ email|default:'' }}"
                               autocomplete="email" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        Send Password Reset Link
                    </button>
                </form>

                <div class="text-center mt-3">
                    <a href="/staff/login/">Back to Staff Login</a>
                </div>
            {% endif %}
        </div>
    </div>
</body>
</html>

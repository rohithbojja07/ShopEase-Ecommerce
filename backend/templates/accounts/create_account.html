<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Account | ShopEase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-7 col-lg-5">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h3 text-center mb-2">Create Your Account</h1>
                    <p class="text-secondary text-center mb-4">
                        Join ShopEase
                    </p>

                    {% if errors %}
                    <div class="alert alert-danger">
                        <ul class="mb-0">
                            {% for error in errors %}
                            <li>{{ error }}</li>
                            {% endfor %}
                        </ul>
                    </div>
                    {% endif %}

                    {% if success %}
                    <div class="alert alert-success" role="status">
                        {{ success }}
                    </div>
                    <a href="{% url 'storefront:home' %}" class="btn btn-primary w-100">
                        Continue Shopping
                    </a>
                    {% else %}
                    <form method="post">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label for="first_name" class="form-label">Full name</label>
                            <input class="form-control" id="first_name"
                                   name="first_name" type="text"
                                   value="{{ form_data.first_name|default:'' }}"
                                   autocomplete="name" required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email address</label>
                            <input class="form-control" id="email"
                                   name="email" type="email"
                                   value="{{ form_data.email|default:'' }}"
                                   autocomplete="email" required>
                        </div>

                        <div class="mb-3">
                            <label for="phone" class="form-label">Mobile number</label>
                            <input class="form-control" id="phone"
                                   name="phone" type="tel"
                                   inputmode="numeric" maxlength="10"
                                   pattern="[6-9][0-9]{9}"
                                   value="{{ form_data.phone|default:'' }}"
                                   placeholder="10-digit Indian mobile number"
                                   autocomplete="tel" required>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input class="form-control" id="password"
                                   name="password" type="password"
                                   autocomplete="new-password" required>
                        </div>

                        <div class="mb-3">
                            <label for="password2" class="form-label">Confirm password</label>
                            <input class="form-control" id="password2"
                                   name="password2" type="password"
                                   autocomplete="new-password" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            Create Account
                        </button>
                    </form>
                    {% endif %}

                    <div class="text-center mt-3">
                        <a href="{% url 'staff_portal:login' %}">
                            Back to Staff Login
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>

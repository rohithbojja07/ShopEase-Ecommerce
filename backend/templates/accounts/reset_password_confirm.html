<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Choose a New Password | ShopEase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h3 mb-3">Choose a new password</h1>

                    {% if error %}
                    <div class="alert alert-danger" role="alert">{{ error }}</div>
                    {% endif %}

                    {% if success %}
                    <div class="alert alert-success" role="status">{{ success }}</div>
                    <a class="btn btn-primary w-100"
                       href="{% url 'staff_portal:login' %}">Go to Staff Login</a>
                    {% elif uidb64 and token %}
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="new_password" class="form-label">New password</label>
                            <input class="form-control" id="new_password"
                                   name="new_password" type="password"
                                   autocomplete="new-password" required>
                        </div>
                        <div class="mb-3">
                            <label for="confirm_password" class="form-label">
                                Confirm new password
                            </label>
                            <input class="form-control" id="confirm_password"
                                   name="confirm_password" type="password"
                                   autocomplete="new-password" required>
                        </div>
                        <button class="btn btn-primary w-100" type="submit">
                            Reset Password
                        </button>
                    </form>
                    {% endif %}

                    <div class="text-center mt-3">
                        <a href="{% url 'staff_portal:login' %}">Back to Staff Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>

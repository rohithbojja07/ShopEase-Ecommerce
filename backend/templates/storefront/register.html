{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Account | ShopEase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 500px">
    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <h2 class="mb-2">Create your ShopEase account</h2>
            <p class="text-secondary mb-4">Register to start shopping.</p>

            <form id="registerForm">
                <label class="form-label" for="first_name">Full name</label>
                <input class="form-control mb-3" id="first_name" name="first_name"
                       type="text" maxlength="150" required autocomplete="name">

                <label class="form-label" for="email">Email address</label>
                <input class="form-control mb-3" id="email" name="email"
                       type="email" required autocomplete="email">

                <label class="form-label" for="phone">Mobile number</label>
                <input class="form-control mb-3" id="phone" name="phone"
                       type="tel" inputmode="numeric" pattern="[6-9][0-9]{9}"
                       minlength="10" maxlength="10" required autocomplete="tel"
                       placeholder="10-digit Indian mobile number">

                <label class="form-label" for="password">Password</label>
                <input class="form-control mb-3" id="password" name="password"
                       type="password" required autocomplete="new-password">

                <label class="form-label" for="password2">Confirm password</label>
                <input class="form-control mb-3" id="password2" name="password2"
                       type="password" required autocomplete="new-password">

                <button class="btn btn-primary w-100" id="registerButton" type="submit">
                    Create account
                </button>
            </form>

            <p id="registerMessage" class="mt-3" role="status" aria-live="polite"></p>

            <p class="text-center mt-3 mb-2">
                Already have an account? <a href="/login/">Login</a>
            </p>
            <a href="/">Back to shopping</a>
        </div>
    </div>
</div>

<script>
document.getElementById("registerForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const button = document.getElementById("registerButton");
    const message = document.getElementById("registerMessage");
    const password = document.getElementById("password").value;
    const password2 = document.getElementById("password2").value;

    if (password !== password2) {
        message.className = "mt-3 text-danger";
        message.textContent = "Passwords do not match.";
        return;
    }

    button.disabled = true;
    message.className = "mt-3 text-secondary";
    message.textContent = "Creating your account...";

    try {
        const response = await fetch("/api/auth/register/", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Accept": "application/json"
            },
            body: JSON.stringify({
                first_name: document.getElementById("first_name").value.trim(),
                email: document.getElementById("email").value.trim(),
                phone: document.getElementById("phone").value.trim(),
                password: password,
                password2: password2
            })
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
            message.className = "mt-3 text-danger";

            const errors = Object.entries(data).map(([field, value]) => {
                const detail = Array.isArray(value) ? value.join(" ") :
                    typeof value === "string" ? value : JSON.stringify(value);
                return field + ": " + detail;
            });

            message.textContent = errors.join(" ") || "Registration failed. Please check your details.";
            return;
        }

        message.className = "mt-3 text-success";
        message.textContent =
            "Account created! Check your email for the verification link, then log in.";

        document.getElementById("registerForm").reset();
    } catch (error) {
        message.className = "mt-3 text-danger";
        message.textContent = "Cannot connect to the server. Please try again.";
    } finally {
        button.disabled = false;
    }
});
</script>
</body>
</html>

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | ShopEase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width:480px">
    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <h2 class="mb-4">Login to ShopEase</h2>
            <form id="loginForm">
                <label class="form-label" for="email">Email</label>
                <input class="form-control mb-3" id="email" type="email" required autocomplete="username">
                <label class="form-label" for="password">Password</label>
                <input class="form-control mb-3" id="password" type="password" required autocomplete="current-password">
                <button class="btn btn-primary w-100" id="loginButton" type="submit">Login</button>
            </form>
            <p id="loginMessage" class="mt-3" role="status"></p>
            <p class="mt-3 mb-2">New to ShopEase? <a href="/register/">Create an account</a></p>
            <a href="/">Back to shopping</a>
        </div>
    </div>
</div>
<script>
document.getElementById("loginForm").addEventListener("submit", async function(event) {
    event.preventDefault();
    const button = document.getElementById("loginButton");
    const message = document.getElementById("loginMessage");
    button.disabled = true;
    message.className = "mt-3 text-secondary";
    message.textContent = "Signing in...";

    try {
        const response = await fetch("/api/auth/login/", {
            method: "POST",
            headers: {"Content-Type": "application/json", "Accept": "application/json"},
            body: JSON.stringify({
                email: document.getElementById("email").value.trim(),
                password: document.getElementById("password").value
            })
        });
        const data = await response.json().catch(() => ({}));

        if (!response.ok || !data.access) {
            message.className = "mt-3 text-danger";
            message.textContent = data.detail || "Login failed. Check your email and password.";
            return;
        }

        sessionStorage.setItem("shopease_access_token", data.access);
        if (data.refresh) {
            sessionStorage.setItem("shopease_refresh_token", data.refresh);
        }

        const params = new URLSearchParams(window.location.search);
        const destination = params.get("next");
        window.location.href = destination && destination.startsWith("/") && !destination.startsWith("//")
            ? destination : "/";
    } catch (error) {
        message.className = "mt-3 text-danger";
        message.textContent = "Cannot connect to the server. Please try again.";
    } finally {
        button.disabled = false;
    }
});
</script>
</body>
</html>
